[package]
name = "reqwest-ssrf-guard"
version = "0.1.0"
edition = "2024"
description = "Mitigate SSRF and DNS rebinding in reqwest by filtering DNS results, redirects, and URL literals"
keywords = ["reqwest", "ssrf", "dns-rebinding", "acl", "security"]
categories = ["web-programming", "network-programming"]
license = "MIT"

[features]
default = []
middleware = ["dep:reqwest-middleware", "dep:async-trait", "dep:http"]

[dependencies]
reqwest = { version = "0.13", default-features = false }
tokio = { version = "1", features = ["net"] }
url = "2"
ipnet = "2"
reqwest-middleware = { version = "0.5", optional = true }
async-trait = { version = "0.1", optional = true }
http = { version = "1", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }

[package.metadata.docs.rs]
all-features = true
